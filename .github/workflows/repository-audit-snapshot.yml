name: Generate Stabilization Lockfile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  lockfile:
    if: github.event.pull_request.head.ref == 'chore/repository-stabilization-2026-08-04' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out stabilization branch
        uses: actions/checkout@v4
        with:
          ref: chore/repository-stabilization-2026-08-04

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Generate and validate lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm run check

      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Lock project dependencies'
          git push origin HEAD:chore/repository-stabilization-2026-08-04

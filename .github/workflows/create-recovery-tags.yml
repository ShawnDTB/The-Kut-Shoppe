name: One-time Recovery Tag Creation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  archive:
    if: github.event.head_commit.message == 'Create recovery tags and retire backup branches'
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create annotated recovery tags
        shell: bash
        run: |
          git config user.name 'ShawnDTB'
          git config user.email '30219070+ShawnDTB@users.noreply.github.com'

          if ! git ls-remote --exit-code --tags origin 'refs/tags/pre-platform-v2-main-2026-08-04' > /dev/null; then
            git tag -a 'pre-platform-v2-main-2026-08-04' \
              'c28de06eec94d7e5690b28a6234bae99245dcbbe' \
              -m 'Stable main before Platform V2 consolidation and repository cleanup.'
            git push origin 'refs/tags/pre-platform-v2-main-2026-08-04'
          fi

          if ! git ls-remote --exit-code --tags origin 'refs/tags/pre-repository-stabilization-2026-08-04' > /dev/null; then
            git tag -a 'pre-repository-stabilization-2026-08-04' \
              'e6efe48b37e1c6ead118de917537fd9dfdf966d3' \
              -m 'Platform V2 immediately before repository cleanup and consolidation into main.'
            git push origin 'refs/tags/pre-repository-stabilization-2026-08-04'
          fi

      - name: Retire temporary recovery branches
        shell: bash
        run: |
          for branch in \
            'backup/main-pre-platform-v2-2026-08-04' \
            'backup/pre-stabilization-2026-08-04'; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" > /dev/null; then
              git push origin --delete "${branch}"
            fi
          done

      - name: Remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/create-recovery-tags.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/create-recovery-tags.yml
          git commit -m 'Remove one-time recovery tag workflow'
          git push origin HEAD:main
